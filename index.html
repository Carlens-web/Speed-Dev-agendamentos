<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Agendamento</title>
<meta name="google-site-verification" content="WcKYNA3TsVj-Fm-OYxUfDG2jwjJHZLfYschrL8tfaj4" />
<style>
  @import url('https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,500;9..144,600&family=Inter:wght@400;500;600;700&display=swap');
  :root{
    --ink:#E7EDF4; --paper:#0B1A2B; --panel:#122439; --teal:#4A6FA5; --teal-deep:#0B1A2B;
    --gold:#7FA0CC; --line:#22344A; --muted:#8FA3BB;
  }
  *{box-sizing:border-box;}
  body{
    margin:0;font-family:'Inter',sans-serif;color:var(--ink);
    background:
      radial-gradient(circle at 15% 0%, rgba(74,111,165,.22), transparent 45%),
      radial-gradient(circle at 100% 20%, rgba(74,111,165,.10), transparent 40%),
      var(--paper);
  }
  a{text-decoration:none;color:inherit;}

  nav{
    position:sticky;top:0;z-index:20;
    background:var(--teal-deep);color:#F6F3EC;
    display:flex;align-items:center;justify-content:space-between;
    padding:16px 32px;
  }
  nav .logo{font-family:'Fraunces',serif;font-size:19px;font-weight:600;}
  nav ul{list-style:none;display:flex;gap:28px;margin:0;padding:0;}
  nav li a{font-size:14px;font-weight:600;color:#D8E4E1;padding:6px 2px;border-bottom:2px solid transparent;cursor:pointer;}
  nav li a.active{color:#fff;border-color:var(--gold);}

  section{display:none;}
  section.active{display:block;}

  .hero{padding:64px 32px 48px;text-align:center;max-width:680px;margin:0 auto;}
  .hero h1{font-family:'Fraunces',serif;font-size:clamp(26px, 4vw, 40px);margin:0 0 12px;}
  .hero p{color:var(--muted);font-size:clamp(14px, 1.4vw, 16px);margin:0;}

  .servicos{
    max-width:1100px;margin:0 auto;padding:0 32px 60px;
    display:grid;grid-template-columns:repeat(4,1fr);gap:22px;
  }
  .servico-card{
    background:var(--panel);border-radius:14px;overflow:hidden;
    box-shadow:0 8px 24px rgba(19,42,46,.08);cursor:pointer;
    transition:transform .15s;
  }
  .servico-card:hover{transform:translateY(-4px);}
  .servico-card img{width:100%;height:160px;object-fit:cover;display:block;}
  .servico-card .info{padding:18px 18px 22px;}
  .servico-card h3{font-family:'Fraunces',serif;font-size:18px;margin:0 0 6px;}
  .servico-card p{font-size:13px;color:var(--muted);margin:0;}

  .localizacao{
    background:var(--teal-deep);color:#F6F3EC;padding:48px 32px;
    display:flex;flex-wrap:wrap;gap:32px;justify-content:center;align-items:center;
  }
  .localizacao .texto{max-width:360px;}
  .localizacao h2{font-family:'Fraunces',serif;font-size:22px;margin:0 0 10px;}
  .localizacao p{color:#B9C9C2;font-size:14px;line-height:1.6;margin:0 0 4px;}
  .localizacao iframe{border:0;border-radius:12px;width:100%;max-width:420px;height:260px;}

  .agenda-wrap{display:flex;justify-content:center;padding:48px 24px 64px;}
  .card{
    background:var(--panel);max-width:420px;width:100%;border-radius:16px;
    padding:36px 32px;box-shadow:0 20px 50px rgba(19,42,46,.12);
  }
  .card h2{font-family:'Fraunces',serif;font-size:24px;margin:0 0 6px;}
  .sub{color:var(--muted);font-size:14px;margin:0 0 26px;}
  .field{margin-bottom:16px;}
  .field label{display:block;font-size:12px;font-weight:600;color:var(--muted);margin-bottom:5px;}
  .field input, .field select{
    width:100%;padding:11px 13px;border:1px solid var(--line);border-radius:8px;
    font-family:'Inter',sans-serif;font-size:14px;background:#0B1A2B;border-color:var(--line);color:var(--ink);
    color-scheme:dark;
  }
  .field-row{display:flex;gap:10px;}
  .field-row .field{flex:1;}

  .custom-select{position:relative;}
  .custom-select-btn{
    width:100%;text-align:left;padding:11px 13px;border:1px solid var(--line);
    border-radius:8px;font-family:'Inter',sans-serif;font-size:14px;
    background:#0B1A2B;color:var(--ink);cursor:pointer;
    display:flex;align-items:center;justify-content:space-between;
  }
  .custom-select-btn:hover{border-color:var(--teal);}
  .custom-select-arrow{color:var(--muted);font-size:12px;transition:transform .15s;}
  .custom-select.open .custom-select-arrow{transform:rotate(180deg);}
  .custom-select-list{
    display:none;position:absolute;top:calc(100% + 6px);left:0;right:0;z-index:30;
    background:#122439;border:1px solid var(--line);border-radius:10px;
    list-style:none;margin:0;padding:6px;
    box-shadow:0 12px 30px rgba(0,0,0,.35);max-height:240px;overflow-y:auto;
  }
  .custom-select.open .custom-select-list{display:block;}
  .custom-select-list li{
    padding:10px 12px;border-radius:7px;cursor:pointer;font-size:14px;color:var(--ink);
  }
  .custom-select-list li:hover{background:rgba(74,111,165,.25);}
  .custom-select-list li.selected{background:var(--teal);color:#fff;}

  .date-picker{display:flex;gap:8px;}
  .custom-select.mini{flex:1;min-width:0;}
  .custom-select.mini .custom-select-btn{padding:11px 10px;font-size:13px;}
  button.enviar{
    width:100%;background:var(--teal);color:#fff;border:none;padding:13px;
    border-radius:8px;font-weight:600;font-size:15px;cursor:pointer;margin-top:6px;
  }
  button.enviar:hover{background:var(--teal-deep);}
  button.enviar:disabled{opacity:.6;cursor:not-allowed;}
  .msg{margin-top:16px;padding:12px 14px;border-radius:8px;font-size:14px;display:none;}
  .msg.ok{background:#DCE9E6;color:var(--teal-deep);display:block;}
  .msg.erro{background:#F2DCD9;color:#A3453B;display:block;}

  @media (max-width:900px){
    .servicos{grid-template-columns:repeat(2,1fr);}
  }
  @media (max-width:520px){
    .servicos{grid-template-columns:1fr;}
    nav ul{gap:16px;}
  }
  @media (min-width:1200px){
    nav{padding:20px 64px;}
    .servicos{max-width:1280px;gap:28px;}
    .hero{padding:88px 32px 60px;}
    .localizacao{padding:72px 64px;}
  }
</style>
</head>

<nav>
  <div class="logo">Seu Espaço</div>
  <ul>
    <li><a data-target="home" class="active">Início</a></li>
    <li><a data-target="agendamento">Agendamento</a></li>
  </ul>
</nav>
